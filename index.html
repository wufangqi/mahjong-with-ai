<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>AI 爽胡麻将 · 连续多局</title>
</head>
<body class="play menu" data-theme="classic-green">
  <canvas id="c" data-testid="table-canvas"></canvas>
  <div id="banner" data-testid="win-banner" aria-hidden="true">
    <div id="banner-main" class="main">胡</div>
    <div id="banner-sub">平胡 · 1 番</div>
  </div>

  <header>
    <h1>AI 爽胡麻将</h1>
    <p>连续多局 · 三名 easy 对手 · 无整场总分</p>
  </header>

  <div id="chrome" data-testid="chrome">
    <label class="theme-field">
      <span>主题</span>
      <select id="theme-select" data-testid="theme-select" aria-label="主题"></select>
    </label>
    <label class="theme-field quality-field">
      <span>画质</span>
      <select id="quality-select" data-testid="quality-select" aria-label="画质">
        <option value="auto">自动</option>
        <option value="low">低</option>
        <option value="mid">中</option>
        <option value="high">高</option>
      </select>
    </label>
    <a class="preview-link" href="./preview.html">效果预览</a>
  </div>

  <div id="main-menu" data-testid="main-menu">
    <div class="main-menu-inner">
      <h2>主菜单</h2>
      <p class="menu-blurb">开始一场本地对局。第一局随机庄；结算后可下一局或结束。无总分、无筹码。每个完成动作后自动保存，可继续最近一场。</p>
      <label class="seed-field menu-seed">
        <span>种子</span>
        <input id="seed" data-testid="seed-input" type="number" value="42" />
      </label>
      <button id="continue-match" data-testid="continue-match" type="button" hidden>继续最近一场</button>
      <button id="start-match" data-testid="start-match" type="button">开始一场</button>
      <!-- Compat alias for older e2e / harnesses -->
      <button id="start" data-testid="start-hand" type="button" class="sr-only" tabindex="-1">开始一场</button>
      <div id="save-notice" data-testid="save-notice" class="save-notice" hidden>
        <p id="save-notice-text" data-testid="save-notice-text"></p>
        <div class="menu-secondary">
          <button id="export-incompatible" data-testid="export-incompatible" type="button">导出旧存档</button>
          <button id="dismiss-incompatible" data-testid="dismiss-incompatible" type="button">知道了</button>
        </div>
      </div>
      <div class="menu-secondary">
        <button id="export-data" data-testid="export-data" type="button">导出本地数据</button>
        <button id="clear-data" data-testid="clear-data" type="button">清除本地数据</button>
      </div>
      <label class="dev-replay-field">
        <span>开发者回放（粘贴动作日志 JSON）</span>
        <textarea id="replay-log-input" data-testid="replay-log-input" rows="3" placeholder='[{"type":"StartHand","seed":42}, …]'></textarea>
      </label>
      <button id="dev-replay" data-testid="dev-replay" type="button">开发者回放</button>
    </div>
  </div>

  <div id="hud" data-testid="hud" hidden>
    <span id="hand-index" data-testid="hand-index" class="hand-index"></span>
  </div>
  <div id="theme-notice" data-testid="theme-notice" hidden></div>

  <div id="status" data-testid="status" hidden>加载中…</div>
  <div id="meta" data-testid="meta" hidden></div>

  <div id="response-bar" data-testid="response-bar" hidden>
    <button id="claim-win" data-testid="claim-win" type="button">胡</button>
    <button id="claim-kong" data-testid="claim-kong" type="button">杠</button>
    <button id="claim-pung" data-testid="claim-pung" type="button">碰</button>
    <div id="chow-options" data-testid="chow-options" class="chow-options"></div>
    <button id="pass-win" data-testid="pass-response" type="button">过</button>
  </div>

  <div id="self-bar" data-testid="self-bar" hidden>
    <button id="declare-win" data-testid="declare-win" type="button">自摸</button>
    <div id="kong-options" data-testid="kong-options" class="chow-options"></div>
  </div>

  <div id="draw-panel" data-testid="draw-panel" hidden>
    <div class="draw-panel-inner">
      <h2>流局</h2>
      <p class="draw-summary">不计番 · 不产生分数 · 下一局庄家不变</p>
      <div id="draw-seats" data-testid="draw-seats" class="draw-seats"></div>
      <div class="draw-actions">
        <button id="next-hand" data-testid="next-hand" type="button">下一局</button>
        <button id="end-match-draw" data-testid="end-match" type="button">结束</button>
      </div>
    </div>
  </div>

  <div id="win-panel" data-testid="win-panel" hidden>
    <div class="win-panel-inner">
      <h2>胡牌结算</h2>
      <p class="win-intro">赢家 · 番型 · 番数 · 无整场总分</p>
      <div id="win-summary" data-testid="win-summary" class="win-summary"></div>
      <div class="win-actions">
        <button id="replay-scene" data-testid="replay-scene" type="button">重播场面</button>
        <button id="win-next-hand" data-testid="win-next-hand" type="button">下一局</button>
        <button id="end-match-win" data-testid="end-match-win" type="button">结束</button>
      </div>
    </div>
  </div>

  <div id="hint">单击选牌 · 再点确认出牌 · 可响应时选胡 / 吃 / 碰 / 过</div>

  <div id="error"><div>
    <h2>WebGL 不可用或加载失败</h2>
    <p>本应用需要支持 WebGL2 的桌面浏览器。请使用开发服务器或生产静态构建打开。</p>
  </div></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
