<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>AI 爽胡麻将 · 发牌摸打</title>
</head>
<body class="play">
  <canvas id="c" data-testid="table-canvas"></canvas>

  <header>
    <h1>AI 爽胡麻将</h1>
    <p>发牌 · 摸牌 · 出牌（WUF-51）</p>
  </header>

  <div id="hud">
    <label class="seed-field">
      <span>种子</span>
      <input id="seed" data-testid="seed-input" type="number" value="42" />
    </label>
    <button id="start" data-testid="start-hand" type="button">开始一局</button>
    <a class="preview-link" href="./preview.html">效果预览</a>
  </div>

  <div id="status" data-testid="status">加载中…</div>
  <div id="meta" data-testid="meta"></div>

  <div id="hint">单击选牌 · 再点确认出牌 · 或拖入前方牌河</div>

  <div id="error"><div>
    <h2>WebGL 不可用或加载失败</h2>
    <p>本应用需要支持 WebGL2 的桌面浏览器。请使用开发服务器或生产静态构建打开。</p>
  </div></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
