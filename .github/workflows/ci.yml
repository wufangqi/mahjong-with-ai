name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Core coverage (100% branches)
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: First-screen budget unit tests
        run: npm run test:budget
      - name: Transfer budget measure
        run: npm run budget:measure
      - name: Browser smoke + visual
        run: npm run test:e2e
      - name: Upload visual / e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-artifacts
          path: |
            test-results/
            playwright-report/
            e2e/*-snapshots/
          if-no-files-found: ignore
